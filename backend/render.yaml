services:
  - type: web
    name: atelimarket-backend
    env: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://atelimarket.shop
      - key: BACKEND_URL
        value: https://velqra-aeap.onrender.com
      - key: PAYU_BASE_URL
        value: https://secure.payu.in/_payment
      - key: PAYU_SUCCESS_URL
        value: https://velqra-aeap.onrender.com/api/payment/payu/callback
      - key: PAYU_FAILURE_URL
        value: https://velqra-aeap.onrender.com/api/payment/payu/callback
      - key: FAST2SMS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@atelimarket.shop
      - key: SMS_TEST_MODE
        value: "false"
      - key: SMS_TEST_NUMBERS
        value: ""
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_SALT
        sync: false
  - type: web
    name: atelimarket-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
